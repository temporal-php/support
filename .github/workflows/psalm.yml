name: Psalm

on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'resources/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - '.gitignore'
      - '.gitattributes'
      - '.editorconfig'
      - 'psalm.xml'

  push:
    paths-ignore:
      - 'docs/**'
      - 'resources/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - '.gitignore'
      - '.gitattributes'
      - '.editorconfig'
      - 'psalm.xml'

jobs:
  psalm:
    name: Psalm Validation (PHP ${{ matrix.php }}, OS ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        php: [8.2]
        os: [ubuntu-latest]
    steps:
      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom

      - name: Check Out Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: 📥 Install dependencies with composer
        uses: ramsey/composer-install@v3

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-interaction

      - name: Run Tests
        run: vendor/bin/psalm
